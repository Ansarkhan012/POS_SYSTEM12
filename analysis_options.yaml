# Static analysis for Dokan Pro (Phase 1, ADR-028).
# `flutter analyze` must report zero issues. Do not add `// ignore:` comments
# without a written justification.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # Stricter type checking: no implicit dynamic casts, inference, or raw types.
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Explicit return types keep public APIs readable and reviewable.
    - always_declare_return_types
    # Production code must not print (use structured logging when introduced).
    - avoid_print
    # Dynamic calls bypass the type system.
    - avoid_dynamic_calls
    # Consistent import ordering.
    - directives_ordering
    # Const where possible: cheaper rebuilds on low-end tablets.
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    # Immutable locals by default.
    - prefer_final_locals
    - prefer_single_quotes
    # Un-awaited futures hide errors (critical once persistence exists).
    - unawaited_futures
    # No BuildContext use across async gaps.
    - use_build_context_synchronously
